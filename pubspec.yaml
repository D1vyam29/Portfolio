name: portfolio
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  visibility_detector: ^0.4.0+2
  audioplayers: ^6.5.1
  flame: ^1.34.0
  flame_audio: ^2.11.12
  url_launcher: ^6.2.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.26.2
  flame_test: ^2.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/dino/
    - assets/images/ground/
    - assets/images/obstacles/
    - assets/

  fonts:
    - family: DinoFont
      fonts:
        - asset: assets/fonts/DinoFont.ttf
    - family: NotoColorEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf
